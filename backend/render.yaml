# Honey Chain — Render Deployment Configuration
# https://render.com/docs/deploy-blank

services:
  - type: web
    name: honey-chain-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql+asyncpg://honeychain:honeychain@localhost:5432/honeychain
        # ⚠ Replace with your Render PostgreSQL connection string
      - key: DATABASE_SYNC_URL
        value: postgresql://honeychain:honeychain@localhost:5432/honeychain
        # ⚠ Replace with your Render PostgreSQL connection string (sync)
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://honey-chain.vercel.app,http://localhost:3000
      - key: MQTT_ENABLED
        value: "False"
      - key: DEMO_MODE
        value: "true"