version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: honeychain-db
    environment:
      POSTGRES_USER: honeychain
      POSTGRES_PASSWORD: honeychain
      POSTGRES_DB: honeychain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeychain"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: honeychain-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeychain-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://honeychain:honeychain@postgres:5432/honeychain
      DATABASE_SYNC_URL: postgresql://honeychain:honeychain@postgres:5432/honeychain
      MQTT_BROKER_URL: mosquitto
      MQTT_BROKER_PORT: 1883
      SECRET_KEY: honey-chain-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
